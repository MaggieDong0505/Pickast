name: Daily Pickast Update

on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'scripts/generate_briefing_data.py'
      - 'data/subscriptions.opml'

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run generator regression tests
        run: python3 -m unittest discover -s tests -v

      - name: Run briefing generator
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python3 scripts/generate_briefing_data.py

      - name: Verify today's briefing was generated
        run: |
          python3 - <<'PY'
          import re
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          expected = datetime.now(ZoneInfo("Asia/Shanghai")).strftime("%Y.%m.%d")
          generated = Path("src/generatedData.ts").read_text(encoding="utf-8")
          match = re.search(r'"dateStr":\s*"([0-9.]+)"', generated)
          actual = match.group(1) if match else "missing"
          if actual != expected:
              raise SystemExit(f"Expected briefing date {expected}, got {actual}")
          print(f"Verified briefing date: {actual}")
          PY

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/generatedData.ts src/ranking.json src/explore.json src/exploreHistory.json src/briefingHistory.json public/explore.json
          git diff --staged --quiet || git commit -m "chore: daily update $(TZ=Asia/Shanghai date +%Y-%m-%d)"
          git push
