name: Daily Pickast Update

on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'scripts/generate_briefing_data.py'
      - 'data/subscriptions.opml'

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Run briefing generator
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python3 scripts/generate_briefing_data.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/generatedData.ts src/ranking.json src/explore.json src/exploreHistory.json
          git diff --staged --quiet || git commit -m "chore: daily update $(TZ=Asia/Shanghai date +%Y-%m-%d)"
          git push
